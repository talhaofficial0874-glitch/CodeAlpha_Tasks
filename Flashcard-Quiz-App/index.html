<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Quiz App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><i class="fa-solid fa-layer-group"></i> Flashcards</h1>
            <button id="add-card-btn" class="primary-btn"><i class="fa-solid fa-plus"></i> Add Card</button>
        </header>

        <main>
            <div id="no-cards-message" class="hidden">
                <i class="fa-regular fa-folder-open"></i>
                <h2>No flashcards yet</h2>
                <p>Click the "Add Card" button above to get started.</p>
            </div>

            <div id="flashcard-container" class="flashcard-container hidden">
                <div class="card-status">
                    <span id="current-card-num">1</span> / <span id="total-cards-num">1</span>
                </div>
                
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-inner" id="flashcard-inner">
                        <!-- Front of card -->
                        <div class="flashcard-front">
                            <div class="card-actions">
                                <button class="icon-btn edit-btn" title="Edit Card"><i class="fa-solid fa-pen"></i></button>
                                <button class="icon-btn delete-btn" title="Delete Card"><i class="fa-solid fa-trash"></i></button>
                            </div>
                            <div class="card-content">
                                <h3 class="card-label">Question</h3>
                                <p id="question-text" class="card-text">What is the capital of France?</p>
                                <div class="user-answer-section">
                                    <input type="text" id="user-answer-input" class="user-answer-input" placeholder="Type your answer..." autocomplete="off" />
                                    <button id="submit-answer-btn" class="primary-btn submit-btn">Check Answer</button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Back of card -->
                        <div class="flashcard-back">
                            <div class="card-actions">
                                <button class="icon-btn edit-btn" title="Edit Card"><i class="fa-solid fa-pen"></i></button>
                                <button class="icon-btn delete-btn" title="Delete Card"><i class="fa-solid fa-trash"></i></button>
                            </div>
                            <div class="card-content">
                                <div id="feedback-badge" class="feedback-badge hidden">Correct!</div>
                                <h3 class="card-label">Answer</h3>
                                <p id="answer-text" class="card-text">Paris</p>
                                <div id="user-answer-display" class="user-answer-display hidden">
                                    <span class="label">Your answer:</span>
                                    <span id="user-answer-text" style="color: var(--text-main); font-weight: 600;"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="prev-btn" class="control-btn"><i class="fa-solid fa-arrow-left"></i> Prev</button>
                    <button id="next-btn" class="control-btn">Next <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Add New Flashcard</h2>
                <button id="close-modal-btn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <form id="flashcard-form">
                    <input type="hidden" id="card-id">
                    <div class="form-group">
                        <label for="question-input">Question</label>
                        <textarea id="question-input" rows="3" placeholder="Enter the question here..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="answer-input">Answer</label>
                        <textarea id="answer-input" rows="3" placeholder="Enter the answer here..." required></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="cancel-btn" class="secondary-btn">Cancel</button>
                        <button type="submit" id="save-btn" class="primary-btn">Save Card</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
