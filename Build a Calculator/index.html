<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A professional, glassmorphic calculator application built with HTML, CSS, and JavaScript.">
    <title>Professional Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator-container">
        <div class="calculator">
            <div class="display">
                <div class="previous-operand" id="previous-operand"></div>
                <div class="current-operand" id="current-operand">0</div>
            </div>
            <div class="keypad">
                <button class="btn btn-action" data-action="clear" aria-label="Clear All">AC</button>
                <button class="btn btn-action" data-action="delete" aria-label="Delete last digit">DEL</button>
                <button class="btn btn-action" data-action="percentage" aria-label="Percentage">%</button>
                <button class="btn btn-operator" data-action="divide" aria-label="Divide">÷</button>

                <button class="btn" data-number>7</button>
                <button class="btn" data-number>8</button>
                <button class="btn" data-number>9</button>
                <button class="btn btn-operator" data-action="multiply" aria-label="Multiply">×</button>

                <button class="btn" data-number>4</button>
                <button class="btn" data-number>5</button>
                <button class="btn" data-number>6</button>
                <button class="btn btn-operator" data-action="subtract" aria-label="Subtract">−</button>

                <button class="btn" data-number>1</button>
                <button class="btn" data-number>2</button>
                <button class="btn" data-number>3</button>
                <button class="btn btn-operator" data-action="add" aria-label="Add">+</button>

                <button class="btn btn-zero" data-number>0</button>
                <button class="btn" data-number>.</button>
                <button class="btn btn-equals" data-action="calculate" aria-label="Calculate">=</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
