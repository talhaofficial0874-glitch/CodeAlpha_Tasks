<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="chat-wrapper">
        <div class="chat-container">
            <div class="chat-header">
                <div class="header-info">
                    <div class="avatar">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix&backgroundColor=a855f7" alt="Bot Avatar">
                        <div class="status-indicator"></div>
                    </div>
                    <div class="title-container">
                        <h2>Support Assistant</h2>
                        <p>Typically replies instantly</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="action-btn"><i class="fas fa-ellipsis-v"></i></button>
                    <button class="action-btn"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message-wrapper bot-wrapper">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix&backgroundColor=a855f7" alt="Bot" class="message-avatar">
                    <div class="message-content">
                        <div class="message bot-message">
                            Hello! 👋 I'm your professional AI assistant. How can I help you today?
                        </div>
                        <span class="timestamp">Just now</span>
                    </div>
                </div>
            </div>

            <div class="chat-input-wrapper">
                <div class="chat-input-container">
                    <button class="attach-btn"><i class="fas fa-paperclip"></i></button>
                    <input type="text" id="userInput" placeholder="Write a message..." autocomplete="off">
                    <button id="sendBtn" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="branding">Powered by <span>AI</span></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=2"></script>
</body>
</html>
